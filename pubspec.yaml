name: locale_sweep
description: >-
  A CI quality gate for Flutter localization. Runs app flows across locales,
  device sizes, text scales, and RTL modes, then reports broken screens with
  screenshot proof.
version: 0.1.5
homepage: https://github.com/Piyushhhhh/locale_sweep
repository: https://github.com/Piyushhhhh/locale_sweep
issue_tracker: https://github.com/Piyushhhhh/locale_sweep/issues
topics:
  - flutter
  - localization
  - testing
  - rtl

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  args: ^2.6.0
  yaml: ^3.1.3
  path: ^1.9.1
  http: ^1.3.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
